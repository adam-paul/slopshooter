name: poll

on:
  schedule:
    # Every 15 minutes. GitHub delays scheduled runs under load — fine here,
    # the cursor makes every run incremental regardless of when it fires.
    # NOTE: GitHub auto-disables cron workflows in public repos after ~60 days
    # without repository activity (green skips don't count). If polling ever
    # stops with no red runs, check this workflow for a "disabled" banner.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra poll.ts args (e.g. "--dry-run" or "--ignore-cursor --max-pages=200")'
        required: false
        default: ''

# The poll job only reads public repo contents; never grant it a writable token.
permissions:
  contents: read

concurrency:
  # At most one run in flight and one queued; extra cron ticks that fire during
  # a long backfill are canceled (harmless — the queued run catches up via the cursor).
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Generous for manual backfill runs (hundreds of pages + D1 writes).
    timeout-minutes: 60
    steps:
      # Three-state gate, before checkout (it needs nothing from the tree):
      #   all four secrets absent -> green skip on cron (fresh repo, no alarm spam)
      #   some but not all        -> RED, naming the missing ones
      #   all four present        -> run
      # Manual dispatch never skips silently — incomplete config is red there too.
      # Whitespace-only values count as absent (a stray newline from `gh secret set`
      # would otherwise pass here and 401 downstream).
      - name: Gate on secrets
        id: gate
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          # Secret keeps the CLOUDFLARE_ name; the env var is renamed so local
          # bun-loaded .env values can never shadow wrangler's OAuth login.
          D1_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=()
          present=()
          for name in TWITTERAPI_IO_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID D1_API_TOKEN; do
            val="${!name}"
            if [ -z "${val//[[:space:]]/}" ]; then missing+=("$name"); else present+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            # Only ever written when true — an unset output already fails the
            # `== 'true'` tests below, and a literal 'false' string would be
            # truthy in Actions expressions if a future step tested it bare.
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${#present[@]}" -eq 0 ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::notice title=Poll skipped::No secrets configured yet — add the four secrets from .env.example (Settings -> Secrets and variables -> Actions) to enable polling."
          else
            echo "::error title=Poll misconfigured::Missing secret(s): ${missing[*]}. Present: ${present[*]:-none}. All four secrets from .env.example are required."
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
      # SHA-pinned third-party action (mutable tags can be repointed); bump by
      # re-resolving the tag: gh api repos/oven-sh/setup-bun/commits/v2 --jq .sha
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'
      - name: Poll @pangram and write verdicts to D1
        if: steps.gate.outputs.run == 'true'
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Passed via env, expanded by bash — never interpolate ${{ inputs.* }}
          # into the script text (expression expansion happens before bash parses,
          # i.e. script injection with all four secrets in scope).
          ARGS: ${{ inputs.args }}
        # $ARGS deliberately unquoted: it is a whitespace-separated flag list.
        run: bun run pipeline/poll.ts $ARGS
