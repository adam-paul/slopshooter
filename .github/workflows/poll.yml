name: poll

on:
  schedule:
    # Every 15 minutes. GitHub delays scheduled runs under load — fine here,
    # the cursor makes every run incremental regardless of when it fires.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra poll.ts args (e.g. "--dry-run" or "--ignore-cursor --max-pages=200")'
        required: false
        default: ''

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Generous for manual backfill runs (hundreds of pages + D1 writes); the
    # concurrency group already serializes runs, so a long one can't stampede.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Skip cleanly (green) until secrets are configured, instead of failing
      # red every 15 minutes on a fresh repo.
      - name: Gate on secrets
        id: gate
        env:
          KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Poll skipped::Secrets not set yet — add the four secrets from .env.example (repo Settings -> Secrets and variables -> Actions) to enable polling."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.configured == 'true'
      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.configured == 'true'
      - name: Poll @pangram and write verdicts to D1
        if: steps.gate.outputs.configured == 'true'
        run: bun run pipeline/poll.ts ${{ inputs.args }}
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
