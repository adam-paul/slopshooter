<!doctype html>
<meta charset="utf-8" />
<title>Slopshooter — Leaderboard table</title>
<style>
	:root { --bg: #0e1116; --fg: #e6e8eb; --dim: #8b949e; --line: #21262d;
		--accent: #58a6ff; --accent-dim: rgba(88, 166, 255, 0.25);
		--ai: #f85149; --mix: #d29922; --human: #3fb950; }
	body { margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
		font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
	a { color: var(--accent); text-decoration: none; }
	table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
	th { text-align: left; color: var(--dim); font-weight: 500; font-size: 0.75rem;
		text-transform: uppercase; letter-spacing: 0.05em; }
	th, td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
	.r { text-align: right; }
	td.r { font-variant-numeric: tabular-nums; }
	.bar { background: linear-gradient(to right, var(--accent-dim) var(--pct), transparent var(--pct));
		padding: 0.1rem 0.4rem; border-radius: 3px; }
	.dim { color: var(--dim); }
	.v-ai { color: var(--ai); } .v-mix { color: var(--mix); } .v-human { color: var(--human); }
</style>
<table>
	<thead><tr><th class="r">#</th><th>Tagger</th><th class="r">Checks</th><th class="r">AI</th><th class="r">Mixed</th><th class="r">Human</th><th class="r">Hit rate</th><th class="r">Last tag</th></tr></thead>
	<tbody>
		<tr><td class="r dim">1</td><td><a href="#">@slophunter42</a></td><td class="r">60</td><td class="r v-ai">57</td><td class="r v-mix">2</td><td class="r v-human">1</td><td class="r"><span class="bar" style="--pct: 95%">95%</span></td><td class="r dim">2h ago</td></tr>
		<tr><td class="r dim">2</td><td><a href="#">@aivigilante</a></td><td class="r">28</td><td class="r v-ai">24</td><td class="r v-mix">1</td><td class="r v-human">3</td><td class="r"><span class="bar" style="--pct: 86%">86%</span></td><td class="r dim">5h ago</td></tr>
		<tr><td class="r dim">3</td><td><a href="#">@checkedm8</a></td><td class="r">112</td><td class="r v-ai">71</td><td class="r v-mix">18</td><td class="r v-human">23</td><td class="r"><span class="bar" style="--pct: 63%">63%</span></td><td class="r dim">1d ago</td></tr>
		<tr><td class="r dim">4</td><td><a href="#">@vibesonly</a></td><td class="r">9</td><td class="r v-ai">3</td><td class="r v-mix">2</td><td class="r v-human">4</td><td class="r"><span class="bar" style="--pct: 33%">33%</span></td><td class="r dim">3d ago</td></tr>
	</tbody>
</table>
