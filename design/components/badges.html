<!doctype html>
<meta charset="utf-8" />
<title>Slopshooter — Verdict badges</title>
<style>
	:root { --bg: #0e1116; --fg: #e6e8eb; --dim: #8b949e; --line: #21262d;
		--ai: #f85149; --mix: #d29922; --human: #3fb950; }
	body { margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
		font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
	h1 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 1rem; }
	.set { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
	.badge { display: inline-block; min-width: 3.5rem; text-align: center; padding: 0.05rem 0.45rem;
		border-radius: 999px; font-size: 0.72rem; font-weight: 600; border: 1px solid var(--line); }
	.v-ai { color: var(--ai); border-color: var(--ai); }
	.v-mix { color: var(--mix); border-color: var(--mix); }
	.v-human { color: var(--human); border-color: var(--human); }
	.flag { font-size: 0.7rem; color: var(--mix); border: 1px dashed var(--mix); border-radius: 3px; padding: 0 0.3rem; }
	.note { color: var(--dim); font-size: 0.75rem; }
</style>
<h1>Verdict badges</h1>
<div class="set">
	<span class="badge v-ai">AI</span>
	<span class="badge v-mix">Mixed</span>
	<span class="badge v-human">Human</span>
	<span class="note">pill, 999px radius, 0.72rem/600, colored border + text on dark ground</span>
</div>
<h1>Reliability flag</h1>
<div class="set">
	<span class="flag">short-text</span>
	<span class="note">dashed border — Pangram's own sub-75-word disclaimer, always shown with the verdict it qualifies</span>
</div>
