<!doctype html>
<meta charset="utf-8" />
<title>Slopshooter — Stat blocks</title>
<style>
	:root { --bg: #0e1116; --fg: #e6e8eb; --dim: #8b949e;
		--ai: #f85149; --mix: #d29922; --human: #3fb950; }
	body { margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
		font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
	.stats { display: flex; gap: 2rem; flex-wrap: wrap; }
	.stat .num { display: block; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
	.stat .lbl { color: var(--dim); font-size: 0.85rem; }
	.v-ai { color: var(--ai); } .v-mix { color: var(--mix); } .v-human { color: var(--human); }
</style>
<div class="stats">
	<div class="stat"><span class="num">9,214</span><span class="lbl">checks tracked</span></div>
	<div class="stat"><span class="num">62%</span><span class="lbl">came back AI</span></div>
	<div class="stat"><span class="num">1,847</span><span class="lbl">distinct taggers</span></div>
	<div class="stat"><span class="num v-ai">41</span><span class="lbl">AI</span></div>
	<div class="stat"><span class="num v-mix">7</span><span class="lbl">mixed</span></div>
	<div class="stat"><span class="num v-human">12</span><span class="lbl">human</span></div>
</div>
