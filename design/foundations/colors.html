<!-- @dsCard group="Colors" -->
<!doctype html>
<meta charset="utf-8" />
<title>Slopshooter — Colors</title>
<style>
	:root {
		--bg: #0e1116; --fg: #e6e8eb; --dim: #8b949e; --line: #21262d;
		--accent: #58a6ff; --accent-dim: rgba(88, 166, 255, 0.25);
		--ai: #f85149; --mix: #d29922; --human: #3fb950;
	}
	body { margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
		font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
	h1 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 1rem; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
	.swatch { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
	.chip { height: 56px; }
	.meta { padding: 0.4rem 0.55rem; font-size: 0.72rem; line-height: 1.4; }
	.meta b { display: block; font-size: 0.78rem; }
	.meta code { color: var(--dim); font-family: ui-monospace, monospace; }
</style>
<h1>Slopshooter palette</h1>
<div class="grid">
	<div class="swatch"><div class="chip" style="background:#0e1116"></div><div class="meta"><b>--bg</b><code>#0e1116</code> page ground</div></div>
	<div class="swatch"><div class="chip" style="background:#e6e8eb"></div><div class="meta"><b>--fg</b><code>#e6e8eb</code> body text</div></div>
	<div class="swatch"><div class="chip" style="background:#8b949e"></div><div class="meta"><b>--dim</b><code>#8b949e</code> secondary text</div></div>
	<div class="swatch"><div class="chip" style="background:#21262d"></div><div class="meta"><b>--line</b><code>#21262d</code> borders / rules</div></div>
	<div class="swatch"><div class="chip" style="background:#58a6ff"></div><div class="meta"><b>--accent</b><code>#58a6ff</code> links / bars</div></div>
	<div class="swatch"><div class="chip" style="background:#f85149"></div><div class="meta"><b>--ai</b><code>#f85149</code> AI verdict</div></div>
	<div class="swatch"><div class="chip" style="background:#d29922"></div><div class="meta"><b>--mix</b><code>#d29922</code> mixed verdict</div></div>
	<div class="swatch"><div class="chip" style="background:#3fb950"></div><div class="meta"><b>--human</b><code>#3fb950</code> human verdict</div></div>
</div>
